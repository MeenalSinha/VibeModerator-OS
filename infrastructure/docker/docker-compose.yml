version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vibemod_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vibemod
      POSTGRES_PASSWORD: vibemod_dev_password
      POSTGRES_DB: vibemod
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibemod"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vibemod_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.backend
    container_name: vibemod_backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      DATABASE_URL: postgresql://vibemod:vibemod_dev_password@postgres:5432/vibemod
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-vibemod-dev-secret-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      FRONTEND_URL: http://localhost:3000
      DEVVIT_API_SECRET: ${DEVVIT_API_SECRET:-devvit-secret}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../apps/backend:/app/apps/backend
      - ../../packages:/app/packages
      - /app/node_modules

  frontend:
    build:
      context: ../../
      dockerfile: infrastructure/docker/Dockerfile.frontend
    container_name: vibemod_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://localhost:8080
    depends_on:
      - backend
    volumes:
      - ../../apps/web:/app/apps/web
      - /app/node_modules

volumes:
  postgres_data:
  redis_data:
